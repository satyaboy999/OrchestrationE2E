name: Local Orchestration Flow

on:
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Run Selenium Test Suite
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Execute Selenium Tests via run-tests.ps1
        shell: powershell
        run: |
          Write-Host "Starting Selenium Test Execution Pipeline..." -ForegroundColor Cyan
          
          $projectPath = "C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project"
          cd $projectPath
          
          # Call the existing run-tests.ps1 script for full orchestration
          # This handles: maven execution, log aggregation, allure report generation
          & .\run-tests.ps1
          
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Selenium test execution failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit 1
          }
          
          Write-Host "Selenium Test Suite Completed Successfully" -ForegroundColor Green
      
      - name: Upload Selenium Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\logs\execution.log
            C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\target\allure-results\
            C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\target\site\allure-maven-plugin\
          if-no-files-found: warn
          retention-days: 30

  python-rca-analysis:
    name: Run Python Root Cause Analysis
    needs: selenium-tests
    runs-on: self-hosted
    
    steps:
      - name: Validate Required Paths
        shell: powershell
        run: |
          Write-Host "Validating pipeline prerequisites..." -ForegroundColor Cyan
          
          $paths = @{
              'RCA Framework' = "C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base"
              'Selenium Logs' = "C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\logs"
              'Execution Log' = "C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\logs\execution.log"
          }
          
          $allValid = $true
          foreach ($pathName in $paths.Keys) {
              $path = $paths[$pathName]
              if (Test-Path $path) {
                  Write-Host "[OK] $pathName : $path" -ForegroundColor Green
              } else {
                  Write-Host "[FAIL] $pathName NOT FOUND: $path" -ForegroundColor Red
                  $allValid = $false
              }
          }
          
          if (-not $allValid) {
              Write-Host "Path validation failed. Aborting RCA job." -ForegroundColor Red
              exit 1
          }
          
          Write-Host "All paths validated successfully" -ForegroundColor Green
      
      - name: Execute Python RCA Analysis
        shell: powershell
        run: |
          Write-Host "Starting Python RCA Analysis..." -ForegroundColor Cyan
          
          $rcaPath = "C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base"
          $seleniumLogsPath = "C:\Users\Administrator\Desktop\OrangeHRM_Selenium_Project\logs"
          
          Push-Location $rcaPath
          
          Write-Host "Analyzing logs from: $seleniumLogsPath" -ForegroundColor Yellow
          python main.py -p "$seleniumLogsPath"
          
          $exitCode = $LASTEXITCODE
          Pop-Location
          
          if ($exitCode -eq 0) {
              Write-Host "Python RCA Analysis Completed Successfully" -ForegroundColor Green
          } else {
              Write-Host "Python RCA Analysis Failed with exit code: $exitCode" -ForegroundColor Red
              exit 1
          }
      
      - name: Upload RCA Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rca-analysis-results
          path: |
            C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base\outputs\
            C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base\logs_correlated\
            C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base\logs_unified\
            C:\Users\Administrator\Desktop\Test1\DA_Failure Analysis Code Base\modules\reporting\reports_data\
          if-no-files-found: warn
          retention-days: 30
